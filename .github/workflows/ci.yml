name: Android APK

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-36" || { echo "::error::Android API 36 is missing from the runner"; exit 1; }
          for tool in aapt2 apksigner; do
            test -x "$ANDROID_HOME/build-tools/35.0.0/$tool" || { echo "::error::Android Build Tools 35.0.0 ($tool) are missing"; exit 1; }
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:sync
      - working-directory: android
        run: ./gradlew assembleRelease assembleDebug --no-daemon
      - run: pnpm check:android-permissions
      - name: Verify installable preview APK
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify "$apk"
          permissions=$("${ANDROID_HOME}/build-tools/35.0.0/aapt2" dump permissions "$apk")
          if grep -Eq 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|CHANGE_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_WIFI_STATE|DOWNLOAD_WITHOUT_NOTIFICATION|REQUEST_INSTALL_PACKAGES|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM)' <<< "$permissions"; then
            echo "::error::Preview APK declares a forbidden permission"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fintrack-preview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
