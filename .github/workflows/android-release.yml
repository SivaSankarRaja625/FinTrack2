name: Android release artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, for example 1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-36" || { echo "::error::Android API 36 is missing from the runner"; exit 1; }
          for tool in aapt2 apksigner; do
            test -x "$ANDROID_HOME/build-tools/35.0.0/$tool" || { echo "::error::Android Build Tools 35.0.0 ($tool) are missing"; exit 1; }
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:sync

      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="${{ inputs.version_name }}"
          fi
          if [[ ! "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version name is not a supported semantic version" >&2
            exit 1
          fi
          echo "FINTRACK_VERSION_NAME=${VERSION_NAME}" >> "${GITHUB_ENV}"
          echo "FINTRACK_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "${GITHUB_ENV}"

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "Android signing key is missing" >&2
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/fintrack-release.jks

      - name: Build signed APK and AAB
        working-directory: android
        env:
          FINTRACK_KEYSTORE_FILE: ${{ github.workspace }}/android/fintrack-release.jks
          FINTRACK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FINTRACK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FINTRACK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${FINTRACK_KEYSTORE_PASSWORD}" || -z "${FINTRACK_KEY_ALIAS}" || -z "${FINTRACK_KEY_PASSWORD}" ]]; then
            echo "Android signing credentials are incomplete" >&2
            exit 1
          fi
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Remove signing key
        if: always()
        run: rm -f android/fintrack-release.jks

      - name: Verify release package
        shell: bash
        run: |
          pnpm check:android-permissions
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          "${JAVA_HOME}/bin/jarsigner" -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/FinTrack-${FINTRACK_VERSION_NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release/FinTrack-${FINTRACK_VERSION_NAME}.aab"

      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release/FinTrack-${{ env.FINTRACK_VERSION_NAME }}.cdx.json
          upload-artifact: false

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: FinTrack-${{ env.FINTRACK_VERSION_NAME }}-android
          path: release/
          if-no-files-found: error
          retention-days: 30
